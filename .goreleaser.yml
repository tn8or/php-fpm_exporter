version: 2

builds:
  - binary: php-fpm_exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# Raw binaries keep the upstream asset names
# (php-fpm_exporter_<version>_linux_<arch>) that falconansible downloads.
archives:
  - id: binary
    formats: [binary]
  - id: targz
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs:"

# Multi-arch image on GHCR (no Docker Hub). Requires a Docker daemon with buildx
# on the runner.
dockers_v2:
  - id: ghcr
    dockerfile: Dockerfile
    images:
      - "ghcr.io/tn8or/php-fpm_exporter"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: php-fpm_exporter
      org.opencontainers.image.description: "A Prometheus exporter for PHP-FPM. Fork of hipages/php-fpm_exporter."
      org.opencontainers.image.source: https://github.com/tn8or/php-fpm_exporter
      org.opencontainers.image.url: https://github.com/tn8or/php-fpm_exporter
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

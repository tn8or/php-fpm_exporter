version: 2

builds:
  - binary: php-fpm_exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# Raw binaries keep the upstream asset names
# (php-fpm_exporter_<version>_linux_<arch>) that falconansible downloads.
archives:
  - id: binary
    formats: [binary]
  - id: targz
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - "^docs:"
